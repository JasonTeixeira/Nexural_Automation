title = "Nexural Automation secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Historical frontend-v0 local-storage marker names are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''platforms/python/research/nexural-research/frontend-v0/lib/api-keys-context\.tsx''']
regexes = ['''const (STORAGE_KEY|KEYS_ENCRYPTED)\s*=''']
