name: Nexural Research CI

on:
  pull_request:
    paths:
      - "platforms/python/research/nexural-research/**"
      - ".github/workflows/python-research-ci.yml"
      - "platforms/python/research/examples/**"
  push:
    branches: [ main ]
    paths:
      - "platforms/python/research/nexural-research/**"
      - ".github/workflows/python-research-ci.yml"
      - "platforms/python/research/examples/**"

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,mcp]"
      - name: Lint critical trust-boundary surface
        env:
          PYTHONPATH: src
        run: python -m ruff check src/nexural_research/automation.py src/nexural_research/academy src/nexural_research/mcp_server.py src/nexural_research/mcp_hosts.py src/nexural_research/cost_model.py src/nexural_research/gauntlet.py src/nexural_research/strategy_sdk.py src/nexural_research/bridge_sdk.py src/nexural_research/contracts.py src/nexural_research/quality_gate.py src/nexural_research/api/routers/automation.py src/nexural_research/api/routers/export.py src/nexural_research/report/html.py tests/test_automation.py tests/test_academy.py tests/test_academy_execution.py tests/test_academy_interfaces.py tests/test_api.py tests/test_local_path_security.py tests/test_mcp_contract.py tests/test_report_generation.py
      - name: Format check
        run: ruff format --check src/nexural_research/automation.py src/nexural_research/academy src/nexural_research/mcp_server.py src/nexural_research/mcp_hosts.py src/nexural_research/cost_model.py src/nexural_research/gauntlet.py src/nexural_research/strategy_sdk.py src/nexural_research/bridge_sdk.py src/nexural_research/contracts.py src/nexural_research/quality_gate.py src/nexural_research/api/routers/automation.py src/nexural_research/api/routers/export.py src/nexural_research/report/html.py tests/test_automation.py tests/test_academy.py tests/test_academy_execution.py tests/test_academy_interfaces.py tests/test_api.py tests/test_local_path_security.py tests/test_mcp_contract.py tests/test_report_generation.py

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" mypy
      - name: Type check
        run: mypy src/nexural_research/automation.py src/nexural_research/academy src/nexural_research/api/routers/automation.py src/nexural_research/api/routers/export.py src/nexural_research/report/html.py --ignore-missing-imports --no-strict-optional --follow-imports=silent

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Bandit security scan
        run: bandit -r src/ -ll -ii
      - name: Dependency audit
        run: pip-audit -r requirements/py311-ci-lock.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for committed secrets
        run: python scripts/repo-tools/secret_scan.py
      - name: Validate production container dependency pins
        run: python scripts/repo-tools/validate_container_constraints.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=nexural_research --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: platforms/python/research/nexural-research/coverage.xml

  public-mvp-quality-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install public MVP dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Run public MVP quality gate
        shell: bash
        env:
          SETUPTOOLS_USE_DISTUTILS: stdlib
          PYTHONPATH: src
        run: python -m nexural_research.cli quality-gate --threshold 0.95 --json --fast

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research/frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platforms/python/research/nexural-research/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Audit desktop packaging dependencies
        working-directory: platforms/python/research/nexural-research/desktop
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    defaults:
      run:
        working-directory: platforms/python/research/nexural-research
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build Docker image
        run: docker build -t nexural-research:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexural-research:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platforms/python/research/nexural-research/frontend/package-lock.json
      - name: Install production browser test dependencies
        working-directory: platforms/python/research/nexural-research/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser workflows against the locked-down production image
        run: |
          docker run -d --name nexural-ci \
            --read-only \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,uid=10001,gid=10001,mode=1770,size=1g \
            --tmpfs /app/data:rw,nosuid,uid=10001,gid=10001,mode=0770,size=1g \
            --tmpfs /app/reports:rw,nosuid,uid=10001,gid=10001,mode=0770,size=256m \
            --tmpfs /app/experiments:rw,nosuid,uid=10001,gid=10001,mode=0770,size=256m \
            -p 127.0.0.1:8011:8000 \
            nexural-research:ci
          trap 'docker rm -f nexural-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8011/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs nexural-ci
              exit 1
            fi
            sleep 1
          done
          docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.Privileged}}' nexural-ci \
            | grep '^10001:10001 true false$'
          E2E_FRONTEND_URL=http://127.0.0.1:8011 npm run test:e2e --prefix frontend
