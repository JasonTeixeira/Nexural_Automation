<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Automation Academy evidence learning loop</title>
  <desc id="desc">The learner studies a concept, edits a declarative starter, runs visible tests, submits to a trusted runner, receives derived evidence, and iterates or advances.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C7F464"/></marker><style>.d{font-family:"Space Grotesk","Segoe UI",sans-serif;font-weight:700}.m{font-family:"JetBrains Mono","Consolas",monospace}.n{fill:#18201C;stroke:#56635D;stroke-width:2}.e{fill:none;stroke:#C7F464;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="675" fill="#111714"/>
  <text x="52" y="58" class="d" font-size="28" fill="#F4F0E6">AUTOMATION ACADEMY / THE EVIDENCE LOOP</text>
  <text x="52" y="88" class="m" font-size="13" fill="#8E9B95">LEARNER INPUT IS DATA • GRADES ARE REPLAYED AND DERIVED</text>
  <rect x="454" y="244" width="292" height="168" fill="#F4F0E6"/>
  <text x="600" y="288" class="d" font-size="25" fill="#111714" text-anchor="middle">Trusted runner</text>
  <text x="600" y="322" class="m" font-size="14" fill="#27332E" text-anchor="middle">constrained trace language</text>
  <text x="600" y="350" class="m" font-size="14" fill="#27332E" text-anchor="middle">visible + hidden checks</text>
  <rect x="490" y="372" width="220" height="22" fill="#C7F464"/>
  <text x="600" y="388" class="m" font-size="11" font-weight="700" fill="#111714" text-anchor="middle">NO ARBITRARY CODE IMPORT</text>
  <g>
    <rect x="52" y="140" width="220" height="110" class="n"/><text x="74" y="174" class="m" font-size="13" fill="#C7F464">01 / UNDERSTAND</text><text x="74" y="209" class="d" font-size="20" fill="#F4F0E6">Read the concept</text><text x="74" y="233" class="m" font-size="12" fill="#8E9B95">EN + ES</text>
    <rect x="52" y="405" width="220" height="110" class="n"/><text x="74" y="439" class="m" font-size="13" fill="#C7F464">02 / IMPLEMENT</text><text x="74" y="474" class="d" font-size="20" fill="#F4F0E6">Edit the starter</text><text x="74" y="498" class="m" font-size="12" fill="#8E9B95">declarative program</text>
    <rect x="928" y="140" width="220" height="110" class="n"/><text x="950" y="174" class="m" font-size="13" fill="#C7F464">04 / INSPECT</text><text x="950" y="209" class="d" font-size="20" fill="#F4F0E6">Read the evidence</text><text x="950" y="233" class="m" font-size="12" fill="#8E9B95">trace • faults • digest</text>
    <rect x="928" y="405" width="220" height="110" class="n"/><text x="950" y="439" class="m" font-size="13" fill="#C7F464">03 / SUBMIT</text><text x="950" y="474" class="d" font-size="20" fill="#F4F0E6">Run the grader</text><text x="950" y="498" class="m" font-size="12" fill="#8E9B95">source hash captured</text>
  </g>
  <path d="M162 250V395" class="e"/><path d="M272 460H444" class="e"/><path d="M746 328H918V405" class="e"/><path d="M1038 405V260" class="e"/><path d="M928 195H282" class="e"/>
  <polygon points="600,132 630,162 600,192 570,162" fill="#241A14" stroke="#FF6B35" stroke-width="2"/>
  <text x="600" y="122" class="m" font-size="12" fill="#FF8A5C" text-anchor="middle">PASS?</text>
  <path d="M600 192V234" class="e"/>
  <text x="670" y="178" class="m" font-size="11" fill="#C7F464">YES → NEXT LAB / CAPSTONE</text>
  <text x="402" y="178" class="m" font-size="11" fill="#FF8A5C">NO → TRACE EXPLAINS WHY</text>
  <rect x="52" y="572" width="1096" height="48" fill="#1C261F" stroke="#56635D"/>
  <text x="600" y="602" class="m" font-size="13" fill="#F4F0E6" text-anchor="middle">A learner-supplied “passed: true” is ignored. The server replays the artifact and computes the grade.</text>
</svg>
