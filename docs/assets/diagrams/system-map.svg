<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nexural Automation system map</title>
  <desc id="desc">A simulation-first flow from learning and research through qualification, the safety kernel, NinjaTrader adapters, simulated execution, and evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7F464"/></marker>
    <style>
      .display{font-family:"Space Grotesk","Segoe UI",sans-serif;font-weight:700;fill:#F4F0E6}
      .mono{font-family:"JetBrains Mono","Consolas",monospace;fill:#8E9B95}
      .node{fill:#18201C;stroke:#56635D;stroke-width:2}
      .gate{fill:#241A14;stroke:#FF6B35;stroke-width:2}
      .edge{fill:none;stroke:#C7F464;stroke-width:3;marker-end:url(#arrow)}
      .muted{fill:none;stroke:#56635D;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#111714"/>
  <path d="M0 88H1200M0 600H1200" stroke="#27332E"/>
  <text x="52" y="54" class="display" font-size="28">NEXURAL AUTOMATION / SYSTEM MAP</text>
  <text x="1148" y="52" class="mono" font-size="13" text-anchor="end">SIMULATION-FIRST • EVIDENCE-DRIVEN</text>

  <text x="52" y="126" class="mono" font-size="13">01 / LEARN + PROVE</text>
  <rect x="52" y="146" width="250" height="122" class="node"/>
  <text x="76" y="181" class="display" font-size="21">Automation Academy</text>
  <text x="76" y="211" class="mono" font-size="14">60 labs • 5 capstones</text>
  <text x="76" y="236" class="mono" font-size="14">code-derived grading</text>

  <rect x="52" y="338" width="250" height="122" class="node"/>
  <text x="76" y="373" class="display" font-size="21">Research engine</text>
  <text x="76" y="403" class="mono" font-size="14">walk-forward • costs</text>
  <text x="76" y="428" class="mono" font-size="14">DSR • Monte Carlo</text>

  <text x="390" y="126" class="mono" font-size="13">02 / QUALIFY</text>
  <polygon points="492,146 592,207 492,268 392,207" class="gate"/>
  <text x="492" y="197" class="display" font-size="18" text-anchor="middle">Promotion</text>
  <text x="492" y="220" class="mono" font-size="13" text-anchor="middle">evidence gate</text>
  <rect x="392" y="338" width="200" height="122" class="gate"/>
  <text x="416" y="373" class="display" font-size="20">Fault suite</text>
  <text x="416" y="403" class="mono" font-size="13">property • fuzz</text>
  <text x="416" y="428" class="mono" font-size="13">mutation • RTO</text>

  <text x="680" y="126" class="mono" font-size="13">03 / CONTROL</text>
  <rect x="680" y="146" width="230" height="314" fill="#1C261F" stroke="#C7F464" stroke-width="3"/>
  <text x="706" y="184" class="display" font-size="22">C# safety kernel</text>
  <path d="M706 204H884" stroke="#56635D"/>
  <text x="706" y="237" class="mono" font-size="14">account/provider gate</text>
  <text x="706" y="270" class="mono" font-size="14">sequence + time gate</text>
  <text x="706" y="303" class="mono" font-size="14">reconciliation</text>
  <text x="706" y="336" class="mono" font-size="14">risk limits</text>
  <text x="706" y="369" class="mono" font-size="14">durable kill switch</text>
  <text x="706" y="402" class="mono" font-size="14">cursor • ACK • journal</text>
  <rect x="706" y="421" width="178" height="24" fill="#C7F464"/>
  <text x="795" y="438" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="700" fill="#111714" text-anchor="middle">FAIL CLOSED</text>

  <text x="998" y="126" class="mono" font-size="13">04 / EXECUTE + PROVE</text>
  <rect x="998" y="146" width="150" height="122" class="node"/>
  <text x="1073" y="181" class="display" font-size="19" text-anchor="middle">NT8 adapter</text>
  <text x="1073" y="211" class="mono" font-size="13" text-anchor="middle">Strategy</text>
  <text x="1073" y="235" class="mono" font-size="13" text-anchor="middle">or AddOn</text>
  <rect x="998" y="338" width="150" height="122" class="node"/>
  <text x="1073" y="373" class="display" font-size="19" text-anchor="middle">Simulator</text>
  <text x="1073" y="403" class="mono" font-size="13" text-anchor="middle">Sim101</text>
  <text x="1073" y="428" class="mono" font-size="13" text-anchor="middle">Playback101</text>

  <path d="M302 207H382" class="edge"/><path d="M302 399H382" class="edge"/>
  <path d="M592 207H670" class="edge"/><path d="M592 399H670" class="edge"/>
  <path d="M910 207H988" class="edge"/><path d="M1073 268V328" class="edge"/>
  <path d="M998 399H930V510H492V470" class="muted"/>

  <rect x="52" y="520" width="1096" height="54" fill="#F4F0E6"/>
  <text x="76" y="553" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#111714">PROMOTION RULE</text>
  <text x="248" y="553" font-family="JetBrains Mono,Consolas,monospace" font-size="14" fill="#27332E">No historical metric, green unit test, or marketing claim bypasses native simulation evidence.</text>
  <text x="52" y="640" class="mono" font-size="12">LEGEND</text>
  <line x1="123" y1="635" x2="169" y2="635" class="edge"/><text x="183" y="640" class="mono" font-size="12">trusted forward path</text>
  <line x1="366" y1="635" x2="412" y2="635" class="muted"/><text x="426" y="640" class="mono" font-size="12">evidence feedback</text>
  <rect x="620" y="625" width="16" height="16" class="gate"/><text x="646" y="640" class="mono" font-size="12">human / safety gate</text>
</svg>
